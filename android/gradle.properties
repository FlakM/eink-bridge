android.useAndroidX=true
org.gradle.jvmargs=-Xmx2048m
# Reuse the configuration between runs: most of a `just test` here is Gradle deciding
# what to do, not doing it.
org.gradle.configuration-cache=true
# Reuse task outputs between builds (the test task is still keyed on its inputs).
org.gradle.caching=true
# Build independent projects in parallel; with one module this mostly avoids waiting.
org.gradle.parallel=true
