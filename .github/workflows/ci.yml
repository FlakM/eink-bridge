name: ci

on:
  push:
  pull_request:

# A new push to the same branch makes the old run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Check formatting
        run: nix develop -c just check-fmt
      - name: Clippy
        run: nix develop -c just clippy
      - name: Tests
        run: nix develop -c just test
      - name: Eval
        run: nix develop -c just eval

  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Assets
        run: nix develop -c just lint-assets
      - name: Harness tests
        # Includes the skill-flag check, which builds the CLI on first use.
        run: nix develop -c python3 -m unittest discover -s harness/tests -v

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-
      - name: Unit tests
        run: nix develop -c sh -c 'cd android && ./gradlew testDebugUnitTest'

  # The instrumented suite: the real app, a real WebView, a real server, on an emulator.
  # Everything below Robolectric is exercised here, which is where the two bugs of
  # 2026-11-03 lived (a page function that did not exist, and a layout inflated as the
  # wrong button class) — both invisible to unit tests.
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Hardware acceleration
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::error::/dev/kvm is missing; the emulator would take longer than the job"
            exit 1
          fi
          ls -l /dev/kvm
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/avd
          key: emulator-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: emulator-
      - name: Instrumented suite
        run: nix develop -c just test-emulator
      - name: Keep the reports when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-reports
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
          if-no-files-found: ignore

  mutations:
    runs-on: ubuntu-latest
    # Every case rebuilds the server or the app; a cold run is slow, a hung one is worse.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Reintroduce every known defect and require a red test
        run: nix develop -c just test-mutations

  nix-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build the package the host actually runs
        run: nix build --print-out-paths
